services:
  db:
    image: postgres:16
    container_name: freela_jobs_db
    environment:
      POSTGRES_USER: freela
      POSTGRES_PASSWORD: freela
      POSTGRES_DB: freela_jobs
    ports:
      - "5432:5432"
    volumes:
      - freela_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freela -d freela_jobs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  freela_pgdata:
